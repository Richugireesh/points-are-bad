[package]
name = "points-are-bad"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "points-are-bad"
path = "src/main.rs"

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
ureq        = { version = "2", features = ["json"] }
dialoguer   = "0.11"
chrono      = "0.4"
anyhow      = "1"

[dev-dependencies]
tempfile    = "3"

[lints.rust]
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# False positives or noise for a CLI binary:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_imports = "allow"
