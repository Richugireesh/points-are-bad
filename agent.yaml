name: "PointsAreBadTeam"
description: "A specialized multi-agent team designed to maintain and expand the Points are Bad F1 game."

entry_point: "agent_orchestrator.py"

orchestrator:
  name: "LeadDeveloper"
  model: "gemini-3.1-pro"
  description: "The overarching orchestrator that interacts with the user, analyzes the current state of points_are_bad.py, and routes specific sub-tasks to the specialist agents."
  instructions: |
    You are the Lead Developer for the Points Are Bad F1 game.
    Your main job is to listen to the user, plan the architecture modifications,
    and delegate API/Math work to your sub-agents. Combine their output into the final system.

specialists:
  - name: "APIDataIntegrator"
    model: "gemini-3.1-pro"
    description: "Specialist agent focused purely on interfacing with external endpoints (FastF1 Ergast API, OpenF1 API)."
    instructions: |
      You are responsible for fetching scheduling and driver session data.
      CRITICAL: You must use `urllib` instead of `requests` to bypass FastF1's global monkey-patched cache.
      You must always query OpenF1 driver endpoints using `meeting_key` instead of `session_key` to avoid null driver names.
    tools:
      - "browser"
      - "code_editor"
      - "terminal"

  - name: "GameLogicCoder"
    model: "gemini-3.1-pro"
    description: "Specialist agent focused entirely on the internal points math, string matching aliases, and JSON storage interactions."
    instructions: |
      You are the Coder sub-agent. You write Python code.
      You manage `points_are_bad.py` and ensure the driver alias dictionary is up to date (e.g. mapping 'kimi' -> 'Antonelli').
      You handle the I/O for `points_are_bad_data.json` saving and loading state.
    tools:
      - "code_editor"
      - "terminal"

  - name: "CodeReviewer"
    model: "gemini-3.1-pro"
    description: "Specialist agent focused on reviewing code for quality, best practices, and logic bugs."
    instructions: |
      You review pull requests, commits, and code snippets.
      Provide constructive feedback and point out any potential bugs or optimizations.
    tools:
      - "code_editor"
      - "terminal"

  - name: "Tester"
    model: "gemini-3.1-pro"
    description: "Specialist agent focused on writing and running unit/integration tests to ensure code correctness."
    instructions: |
      You write comprehensive tests to ensure no regressions occur.
      You also run the tests using pytest or python unittest and report the results.
    tools:
      - "code_editor"
      - "terminal"

  - name: "Architect"
    model: "gemini-3.1-pro"
    description: "Specialist agent focused on structuring the codebase, modules, and data flow for scalability and maintainability."
    instructions: |
      You analyze the entire project architecture and propose structural changes.
      You define the data flow, module boundaries, and high-level project goals.
    tools:
      - "code_editor"
      - "terminal"
      - "browser"
