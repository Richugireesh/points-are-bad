services:
  web:
    build: .
    ports:
      - "${PORT:-5001}:5001"
    volumes:
      # Persist the SQLite database across container restarts.
      # Create the directory on the host first: mkdir -p ./data
      - ./data:/data
    environment:
      # Required for write endpoints.  Set a strong random value in production:
      #   API_TOKEN=$(openssl rand -hex 32)
      API_TOKEN: "${API_TOKEN:-}"
      # Set to "false" to disable rate limiting during local development.
      RATELIMIT_ENABLED: "${RATELIMIT_ENABLED:-true}"
    restart: unless-stopped
    # Resource limits — conservative defaults for a small single-purpose app
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    # Matches the HEALTHCHECK in the Dockerfile; compose uses it for depends_on.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5001/aliases')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── Tailscale sidecar ─────────────────────────────────────────────────────
  # Exposes the web dashboard on your Tailscale tailnet (ts.net).
  # Set TS_AUTHKEY and optionally TS_HOSTNAME in .env before starting.
  # The dashboard will be available at https://<TS_HOSTNAME>.<tailnet>.ts.net
  tailscale:
    image: tailscale/tailscale:latest
    container_name: points-are-bad-ts
    hostname: ${TS_HOSTNAME:-points-are-bad}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?err}
      - TS_HOSTNAME=${TS_HOSTNAME:-points-are-bad}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_PORT=5001
      - TS_USERSPACE=false
    volumes:
      - ./tailscale/state:/var/lib/tailscale
    network_mode: "service:web"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
