[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "points-are-bad"
version = "0.1.0"
description = "F1 Prediction Game — Web Dashboard"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastf1>=3.4.0",
]

[project.optional-dependencies]
web = [
    "flask>=3.0",
    "flask-limiter>=3.0",
    "gunicorn>=22.0",
]
dev = [
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
]

[project.scripts]
points-are-bad-web = "web.server:run"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--cov=points_are_bad --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["points_are_bad"]
omit = ["*/__init__.py", "*/models.py"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
# B904: re-raise inside except — handled where meaningful but not enforced globally
# UP007/UP045: Python 3.9 target — must use Optional[X] / Union[X,Y], never X | Y
ignore = ["B904", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"web/server.py" = ["E402", "I001"]  # sys.path manipulation must happen before imports

[tool.ruff.lint.isort]
known-first-party = ["points_are_bad"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
# fastf1 ships no type stubs
ignore_missing_imports = true
