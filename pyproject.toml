[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "points-are-bad"
version = "0.1.0"
description = "F1 Prediction Game and Agent Orchestrator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastf1>=3.4.0",
    "PyYAML>=6.0.1",
    "textual>=0.60.0",
    "rich>=13.0.0",
]

[project.scripts]
points-are-bad = "points_are_bad.cli:main_menu"
points-are-bad-agent = "points_are_bad.agent_orchestrator:main"
